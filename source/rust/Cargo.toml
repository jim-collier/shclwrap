[package]
name = "shclw"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "A small, stable wrapper over several shcl versions"
publish = false

[features]
default = []
# 3.0 checks a 2.x file against 2.0 before it upgrades it.
shcl3 = ["dep:shcl3", "dep:shcl2"]

[dependencies]
shcl2 = { package = "shcl", version = "=2.0.0", optional = true, default-features = false }
shcl3 = { package = "shcl", git = "https://github.com/yottacore/shcl", rev = "a010fdf8035a654c1b24551f71f1187ecbb47955", optional = true, default-features = false }

[[bin]]
name = "shclw-drive"
required-features = ["shcl3"]

[[test]]
name = "cases"
required-features = ["shcl3"]
# Its own main, so each shared case prints its own test line.
harness = false

[[test]]
name = "api"
required-features = ["shcl3"]

[[test]]
name = "files"
required-features = ["shcl3"]
